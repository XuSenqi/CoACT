[project]
name = "CoACT"
version = "0.1.0"
description = "SLM-based Tool Output Compression for Agent Context Optimization"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "CoACT Team"}
]

dependencies = [
    "json-repair>=0.58.7",
    "pyyaml>=6.0",
    "pydantic>=2.12,<3",
    "rapidfuzz>=3.14",
    "httpx>=0.28.1",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.8",
]

[project.optional-dependencies]
vllm = [
    "tree-sitter>=0.24",
    "tree-sitter-bash>=0.23",
    "datasets>=4.6.1",
    "docker>=7.1.0",
    "litellm>=1.82.0",
    "mini-swe-agent>=2.2.6",
    "swebench>=4.1.0",
    "torch>=2.10.0 ; sys_platform == 'linux'",
    "torchaudio>=2.10.0 ; sys_platform == 'linux'",
    "torchvision>=0.25.0 ; sys_platform == 'linux'",
    "transformers>=5,<6",
    "vllm==0.19.0 ; sys_platform == 'linux'",
    "wandb>=0.25.1",
    "weave>=0.52.35",
    "nvitop>=1.6.2",
    "swe-pruner>=0.1.1",
    "scipy>=1.17",
    "statsmodels>=0.14",
]

training = [
    "accelerate>=1.12.0",
    "tree-sitter>=0.24",
    "tree-sitter-bash>=0.23",
    "causal-conv1d @ git+https://github.com/Dao-AILab/causal-conv1d.git@fcf86720f137846a1d8ab7298cb946a6aa2c15b3",
    "datasets>=4.6.1",
    "deepspeed>=0.18.6",
    "einops>=0.8.2",
    "flash-attn>=2.8.3",
    "flash-linear-attention @ git+https://github.com/fla-org/flash-linear-attention@7cbe461b10bde60180c32c5f9381a04d41887514",
    "liger-kernel-nightly>=0.7.0.dev20260318102353",
    "litellm>=1.82.0",
    "mini-swe-agent>=2.2.8",
    "ninja>=1.13.0",
    "nvitop>=1.6.2",
    "peft>=0.18.1",
    "torch>=2.10.0,<2.11",
    "transformers>=5.3.0",
    "trl>=0.29.0",
    "wandb>=0.25.0",
]

[tool.uv]
conflicts = [
    [
        {extra = "vllm"},
        {extra = "training"},
    ],
]

override-dependencies = [
    "transformers>=5,<6",
]
no-build-isolation-package = [
    "causal-conv1d",
    "flash-attn",
    "flash-linear-attention",
]

[tool.uv.sources]
swebench = { path = "external_libs/SWE-Bench", editable = true }
torch = [
    { index = "pytorch-cu129", extra = "vllm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu129", extra = "vllm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu129", extra = "vllm", marker = "sys_platform == 'linux'" },
]

[tool.uv.extra-build-dependencies]
causal-conv1d = [
    "setuptools>=80",
    "torch>=2.10.0,<2.11",
    "ninja",
    "packaging",
]
flash-attn = [
    "setuptools>=80",
    "torch>=2.10.0,<2.11",
    "ninja",
    "packaging",
]
flash-linear-attention = [
    "setuptools>=80",
    "torch>=2.10.0,<2.11",
    "ninja",
    "packaging",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-nightly-cu129"
url = "https://wheels.vllm.ai/nightly/cu129"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
